<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课表查看器</title>
    <style>
        :root {
            --bg: #f4efe7;
            --panel: rgba(255, 252, 247, 0.92);
            --panel-strong: #fffdf8;
            --text: #1f2933;
            --muted: #5d6b7a;
            --line: #d6c7b5;
            --accent: #b5532d;
            --accent-soft: #f2ddcf;
            --good: #1f6f5f;
            --shadow: 0 18px 40px rgba(78, 52, 31, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(181, 83, 45, 0.18), transparent 30%),
                radial-gradient(circle at right 10% top 20%, rgba(31, 111, 95, 0.12), transparent 26%),
                linear-gradient(180deg, #f8f4ee 0%, var(--bg) 100%);
            min-height: 100vh;
        }

        .shell {
            width: min(1440px, calc(100% - 32px));
            margin: 24px auto 40px;
        }

        .hero {
            padding: 28px;
            border: 1px solid rgba(214, 199, 181, 0.8);
            background: linear-gradient(135deg, rgba(255, 253, 248, 0.95), rgba(249, 242, 233, 0.9));
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.05;
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 12px 0 0;
            max-width: 760px;
            color: var(--muted);
            line-height: 1.65;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 22px;
        }

        .preset-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button,
        .file-label {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 11px 18px;
            font: inherit;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .button {
            color: var(--text);
            background: rgba(255, 253, 248, 0.88);
            border-color: var(--line);
            box-shadow: none;
        }

        .button.secondary,
        .file-label {
            color: var(--text);
            background: rgba(255, 253, 248, 0.88);
            border-color: var(--line);
            box-shadow: none;
        }

        .button.active {
            color: #fff;
            background: linear-gradient(135deg, #1f6f5f, #154f44);
            box-shadow: 0 12px 24px rgba(31, 111, 95, 0.24);
            border-color: rgba(21, 79, 68, 0.7);
        }

        .button:hover,
        .file-label:hover {
            transform: translateY(-1px);
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            color: var(--muted);
        }

        .status.error {
            color: #a33b27;
        }

        .grid {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(214, 199, 181, 0.9);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .meta-list,
        .stats-list {
            display: grid;
            gap: 12px;
        }

        .meta-item,
        .stats-item {
            background: var(--panel-strong);
            border: 1px solid rgba(214, 199, 181, 0.7);
            border-radius: 16px;
            padding: 14px 16px;
        }

        .meta-label,
        .stats-label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .meta-value,
        .stats-value {
            font-size: 17px;
            font-weight: 700;
        }

        .note {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(242, 221, 207, 0.55);
            color: #694735;
            line-height: 1.6;
        }

        .table-shell {
            overflow: auto;
            border-radius: 20px;
            border: 1px solid rgba(214, 199, 181, 0.8);
            background: rgba(255, 253, 248, 0.66);
        }

        table {
            width: 100%;
            min-width: 980px;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f6ede3;
            color: var(--text);
        }

        th,
        td {
            padding: 14px 12px;
            vertical-align: top;
            border-right: 1px solid rgba(214, 199, 181, 0.65);
            border-bottom: 1px solid rgba(214, 199, 181, 0.65);
        }

        th:first-child,
        td:first-child {
            border-left: none;
        }

        tr:first-child th {
            border-top: none;
        }

        th:first-child {
            min-width: 116px;
        }

        td.empty {
            background: rgba(248, 244, 238, 0.75);
            color: #98a3ad;
            text-align: center;
            vertical-align: middle;
        }

        .day-name {
            display: block;
            font-size: 15px;
            font-weight: 700;
        }

        .day-date {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .slot-label {
            display: block;
            font-weight: 700;
            font-size: 15px;
        }

        .slot-sub {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .slot-sub-line {
            display: block;
            margin-top: 3px;
        }

        .cell-stack {
            display: grid;
            gap: 10px;
        }

        .course-card {
            padding: 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 239, 230, 0.92));
            border: 1px solid rgba(214, 199, 181, 0.8);
            box-shadow: 0 8px 20px rgba(70, 53, 34, 0.08);
        }

        .course-card h3 {
            margin: 0;
            font-size: 15px;
            line-height: 1.45;
        }

        .course-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: #7c431f;
            font-size: 12px;
            line-height: 1;
        }

        .course-meta {
            margin-top: 10px;
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: #45525f;
        }

        .week-chip {
            margin-top: 10px;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 12px;
            background: rgba(31, 111, 95, 0.1);
            color: var(--good);
            font-size: 12px;
        }

        .mobile-schedule {
            display: none;
            gap: 14px;
        }

        .mobile-day {
            padding: 18px;
            border-radius: 18px;
            background: var(--panel-strong);
            border: 1px solid rgba(214, 199, 181, 0.8);
        }

        .mobile-day h3 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .mobile-date {
            color: var(--muted);
            font-size: 13px;
        }

        .mobile-slot {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed rgba(214, 199, 181, 0.9);
        }

        .mobile-slot-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: #7c431f;
        }

        .mobile-slot-time {
            margin: 8px 0 12px;
            padding: 10px 12px;
            border-left: 4px solid var(--accent);
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(242, 221, 207, 0.55), rgba(255, 248, 240, 0.95));
            color: #6f3820;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.7;
            box-shadow: inset 0 0 0 1px rgba(181, 83, 45, 0.12);
        }

        .fade-in {
            animation: rise 320ms ease;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1080px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 860px) {
            .table-shell {
                display: none;
            }

            .mobile-schedule {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero fade-in">
            <h1>教师周课表查看器</h1>
            <p>这是一个纯静态页面。会从 <strong>json</strong> 目录加载各周课表，文件名数字表示第几周；同时保留手动选择任意同结构本地 JSON 文件的能力。</p>
            <div class="toolbar">
                <div class="preset-group" id="presetGroup"></div>
                <label class="file-label" for="jsonFile">选择本地 JSON</label>
                <input class="file-input" id="jsonFile" type="file" accept="application/json,.json">
            </div>
            <div class="status" id="status">页面已就绪，正在查找今天对应的周课表；未找到时加载第一周。</div>
        </section>

        <section class="grid">
            <aside class="panel fade-in">
                <h2>课表信息</h2>
                <div class="meta-list" id="metaList"></div>
                <div class="note" id="noteBox">如果浏览器直接以文件方式打开本页，部分浏览器会限制读取同目录 JSON。遇到这种情况时，直接点击“选择本地 JSON”即可正常展示。</div>
            </aside>

            <main class="panel fade-in">
                <h2>周课表</h2>
                <div class="stats-list" id="statsList" style="margin-bottom: 16px;"></div>
                <div class="table-shell" id="tableShell"></div>
                <div class="mobile-schedule" id="mobileSchedule"></div>
            </main>
        </section>
    </div>

    <script>
        const statusEl = document.getElementById("status");
        const metaListEl = document.getElementById("metaList");
        const statsListEl = document.getElementById("statsList");
        const tableShellEl = document.getElementById("tableShell");
        const mobileScheduleEl = document.getElementById("mobileSchedule");
        const noteBoxEl = document.getElementById("noteBox");
        const fileInputEl = document.getElementById("jsonFile");
        const presetGroupEl = document.getElementById("presetGroup");
        const embeddedTimetable = [
            { jcmc: "1", rsdmc: "上午", qssj: "08:40:00", jssj: "09:20:00" },
            { jcmc: "2", rsdmc: "上午", qssj: "09:30:00", jssj: "10:10:00" },
            { jcmc: "3", rsdmc: "上午", qssj: "10:25:00", jssj: "11:05:00" },
            { jcmc: "4", rsdmc: "上午", qssj: "11:05:00", jssj: "11:45:00" },
            { jcmc: "5", rsdmc: "下午", qssj: "14:30:00", jssj: "15:10:00" },
            { jcmc: "6", rsdmc: "下午", qssj: "15:20:00", jssj: "16:00:00" },
            { jcmc: "7", rsdmc: "下午", qssj: "16:15:00", jssj: "16:55:00" },
            { jcmc: "8", rsdmc: "下午", qssj: "17:05:00", jssj: "17:45:00" },
            { jcmc: "9", rsdmc: "晚上", qssj: "19:00:00", jssj: "19:40:00" },
            { jcmc: "10", rsdmc: "晚上", qssj: "19:50:00", jssj: "20:30:00" }
        ];
        const presetConfigs = Array.from({ length: 19 }, (_, index) => {
            const week = index + 2;
            return {
                week,
                file: "json/" + week + ".json"
            };
        });
        let presetButtons = [];
        let timetableMap = new Map();

        buildPresetButtons();

        fileInputEl.addEventListener("change", async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }

            try {
                setStatus("正在读取本地文件 " + file.name + " ...");
                setActivePreset(null);
                const text = await file.text();
                const data = JSON.parse(text);
                renderSchedule(data, file.name);
                setStatus("已加载本地文件 " + file.name + "。", false);
            } catch (error) {
                setStatus("读取本地 JSON 失败: " + error.message, true);
            } finally {
                event.target.value = "";
            }
        });

        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.classList.toggle("error", isError);
        }

        async function loadPreset(fileName) {
            try {
                setStatus("正在加载 " + fileName + " ...");
                setActivePreset(fileName);
                const response = await fetch(fileName, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const data = await response.json();
                renderSchedule(data, fileName);
                setStatus("已加载 " + fileName + "。", false);
            } catch (error) {
                setActivePreset(null);
                setStatus("直接读取 " + fileName + " 失败: " + error.message + "。可改用“选择本地 JSON”加载。", true);
            }
        }

        function buildPresetButtons() {
            presetGroupEl.innerHTML = presetConfigs.map((config) => {
                return "<button class=\"button\" type=\"button\" data-file=\"" + escapeHtml(config.file) + "\">第" + escapeHtml(String(config.week)) + "周</button>";
            }).join("");

            presetButtons = Array.from(presetGroupEl.querySelectorAll("[data-file]"));
            presetButtons.forEach((button) => {
                button.addEventListener("click", () => loadPreset(button.dataset.file));
            });
        }

        async function loadTimetable() {
            try {
                const response = await fetch("timetable.json", { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const timetable = await response.json();
                timetableMap = buildTimetableMap(timetable);
            } catch (error) {
                timetableMap = buildTimetableMap(embeddedTimetable);
                noteBoxEl.textContent = "当前浏览环境未能直接读取 timetable.json，已自动切换为页面内置节次时间，因此手机浏览器中仍可展示具体上课时间。";
            }
        }

        function renderSchedule(data, sourceName) {
            validateScheduleData(data);

            const teacher = data.jsxx || {};
            const days = (data.rqazcList || []).slice().sort((left, right) => Number(left.xqj) - Number(right.xqj));
            const lessons = Array.isArray(data.kbList) ? data.kbList.slice() : [];
            const slotKeys = Array.from(new Set(lessons.map((item) => item.xsdj || item.jcor || item.jc))).sort(compareSlot);
            const slotLabels = new Map();

            lessons.forEach((item) => {
                const key = item.xsdj || item.jcor || item.jc;
                if (key && !slotLabels.has(key)) {
                    slotLabels.set(key, item.jc || (key + "节"));
                }
            });

            renderMeta(data, teacher, sourceName, lessons, days);
            renderStats(lessons, days);
            renderTable(days, slotKeys, lessons, slotLabels);
            renderMobile(days, slotKeys, lessons, slotLabels);
            noteBoxEl.textContent = timetableMap.size > 0
                ? "已按 rqazcList 生成周视图，按 kbList 填充课程，并已接入 timetable.json 的节次时间。相同时间段如有多门课，会在同一单元格内纵向堆叠显示。"
                : "已按 rqazcList 生成周视图，按 kbList 课程明细填充。相同时间段如有多门课，会在同一单元格内纵向堆叠显示。";
        }

        function validateScheduleData(data) {
            if (!data || !Array.isArray(data.rqazcList) || !Array.isArray(data.kbList)) {
                throw new Error("JSON 缺少 rqazcList 或 kbList，无法渲染课表");
            }
        }

        function renderMeta(data, teacher, sourceName, lessons, days) {
            const firstDate = days[0] ? days[0].rq : "-";
            const lastDate = days[days.length - 1] ? days[days.length - 1].rq : "-";
            const campus = uniqueValues(lessons.map((item) => item.xqmc)).join(" / ") || "-";
            const rooms = uniqueValues(lessons.map((item) => item.cdmc || item.cdbh)).join("、") || "-";
            const blocks = uniqueValues(lessons.map((item) => item.xsdj || item.jcor || item.jc)).length;
            const items = [
                ["数据来源", sourceName],
                ["教师", teacher.XM || lessons[0]?.jsxm || "-"],
                ["所属学院", teacher.JGMC || teacher.RKXY || "-"],
                ["学年学期", teacher.XNMC || ((teacher.XNM || "") + " 学年")],
                ["校区", campus],
                ["周范围", firstDate + " 至 " + lastDate],
                ["涉及场地", rooms],
                ["课程条目", String(lessons.length)],
                ["时间段数", String(blocks)]
            ];

            metaListEl.innerHTML = items.map(([label, value]) => {
                return "<div class=\"meta-item\"><span class=\"meta-label\">" + escapeHtml(label) + "</span><span class=\"meta-value\">" + escapeHtml(value || "-") + "</span></div>";
            }).join("");
        }

        function renderStats(lessons, days) {
            const totalStudents = lessons.reduce((sum, item) => sum + Number(item.xkrs || item.jxbrs || 0), 0);
            const courseCount = uniqueValues(lessons.map((item) => item.kcmc)).length;
            const classCount = uniqueValues(lessons.map((item) => item.jxbmc)).length;
            const activeDays = new Set(lessons.map((item) => Number(item.xqj))).size;
            const stats = [
                ["课程数", String(courseCount)],
                ["教学班数", String(classCount)],
                ["上课日数", activeDays + " / " + days.length],
                ["选课人数合计", String(totalStudents)]
            ];

            statsListEl.innerHTML = stats.map(([label, value]) => {
                return "<div class=\"stats-item\"><span class=\"stats-label\">" + escapeHtml(label) + "</span><span class=\"stats-value\">" + escapeHtml(value) + "</span></div>";
            }).join("");
            statsListEl.style.gridTemplateColumns = "repeat(auto-fit, minmax(150px, 1fr))";
        }

        function renderTable(days, slotKeys, lessons, slotLabels) {
            const grouped = groupLessons(lessons);
            const head = days.map((day) => {
                return "<th><span class=\"day-name\">" + escapeHtml(day.xqjmc) + "</span><span class=\"day-date\">" + escapeHtml(day.rq) + "</span></th>";
            }).join("");

            const body = slotKeys.map((slotKey) => {
                const row = days.map((day) => {
                    const cellLessons = grouped.get(makeGroupKey(day.xqj, slotKey)) || [];
                    if (cellLessons.length === 0) {
                        return "<td class=\"empty\">无课程</td>";
                    }
                    return "<td><div class=\"cell-stack\">" + cellLessons.map(renderCourseCard).join("") + "</div></td>";
                }).join("");

                const slotTitle = slotLabels.get(slotKey) || slotKey;
                return "<tr><th><span class=\"slot-label\">" + escapeHtml(slotKey) + "</span>" + renderSlotSub(slotTitle, slotKey) + "</th>" + row + "</tr>";
            }).join("");

            tableShellEl.innerHTML = "<table><thead><tr><th>节次</th>" + head + "</tr></thead><tbody>" + body + "</tbody></table>";
        }

        function renderMobile(days, slotKeys, lessons, slotLabels) {
            const grouped = groupLessons(lessons);
            mobileScheduleEl.innerHTML = days.map((day) => {
                const slots = slotKeys.map((slotKey) => {
                    const cellLessons = grouped.get(makeGroupKey(day.xqj, slotKey)) || [];
                    if (cellLessons.length === 0) {
                        return "";
                    }
                    const slotTitle = slotLabels.get(slotKey) || slotKey;
                    return "<div class=\"mobile-slot\"><div class=\"mobile-slot-title\">" + escapeHtml(slotKey) + " · " + escapeHtml(slotTitle) + "</div>" + renderMobileSlotTime(slotKey) + cellLessons.map(renderCourseCard).join("") + "</div>";
                }).join("");

                return "<section class=\"mobile-day\"><h3>" + escapeHtml(day.xqjmc) + "</h3><div class=\"mobile-date\">" + escapeHtml(day.rq) + "</div>" + (slots || "<div class=\"mobile-slot\">本日无课程</div>") + "</section>";
            }).join("");
        }

        function renderCourseCard(item) {
            const title = item.kcmc || item.jxbmc || "未命名课程";
            const className = item.jxbzcbjjc || item.jxbzc || item.jxbmc || "-";
            const room = item.cdmc || item.cdbh || "-";
            const weeks = item.zcd || "未提供周次";
            const teacher = item.jsxm || item.xm || "-";
            const headCount = item.xkrs || item.jxbrs || "-";
            const exam = item.khfsmc || "-";
            const courseType = item.kcxzjc || "-";

            return [
                "<article class=\"course-card\">",
                "<h3>" + escapeHtml(title) + "</h3>",
                "<div class=\"course-badges\">",
                "<span class=\"badge\">" + escapeHtml(room) + "</span>",
                "<span class=\"badge\">" + escapeHtml(courseType) + "</span>",
                "<span class=\"badge\">" + escapeHtml(exam) + "</span>",
                "</div>",
                "<div class=\"course-meta\">",
                "<div><strong>教学班：</strong>" + escapeHtml(className) + "</div>",
                "<div><strong>教师：</strong>" + escapeHtml(teacher) + "</div>",
                "<div><strong>人数：</strong>" + escapeHtml(String(headCount)) + "</div>",
                "</div>",
                "<span class=\"week-chip\">周次：" + escapeHtml(weeks) + "</span>",
                "</article>"
            ].join("");
        }

        function groupLessons(lessons) {
            const map = new Map();
            lessons.forEach((item) => {
                const day = Number(item.xqj);
                const slotKey = item.xsdj || item.jcor || item.jc;
                const groupKey = makeGroupKey(day, slotKey);
                if (!map.has(groupKey)) {
                    map.set(groupKey, []);
                }
                map.get(groupKey).push(item);
            });

            map.forEach((value) => value.sort(compareLesson));
            return map;
        }

        function makeGroupKey(day, slotKey) {
            return String(day) + "__" + String(slotKey);
        }

        function compareLesson(left, right) {
            const classOrder = String(left.jxbmc || "").localeCompare(String(right.jxbmc || ""), "zh-Hans-CN");
            if (classOrder !== 0) {
                return classOrder;
            }
            return String(left.cdmc || left.cdbh || "").localeCompare(String(right.cdmc || right.cdbh || ""), "zh-Hans-CN");
        }

        function compareSlot(left, right) {
            return extractSlotOrder(left) - extractSlotOrder(right);
        }

        function setActivePreset(fileName) {
            presetButtons.forEach((button) => {
                button.classList.toggle("active", button.dataset.file === fileName);
            });
        }

        function buildTimetableMap(timetable) {
            const grouped = new Map();
            (Array.isArray(timetable) ? timetable : []).forEach((item) => {
                const key = String(item.jcmc || "");
                if (!key) {
                    return;
                }

                if (!grouped.has(key)) {
                    grouped.set(key, []);
                }
                grouped.get(key).push(item);
            });

            grouped.forEach((items, key) => {
                items.sort((left, right) => String(left.qssj || "").localeCompare(String(right.qssj || "")));
                grouped.set(key, {
                    index: key,
                    label: items[0].rsdmc || "",
                    start: items[0].qssj || "",
                    end: items[items.length - 1].jssj || ""
                });
            });

            return grouped;
        }

        function renderSlotSub(slotTitle, slotKey) {
            const lines = ["<span class=\"slot-sub\">" + escapeHtml(slotTitle) + "</span>"];
            const detailLines = getSlotDetailLines(slotKey);
            detailLines.forEach((line) => {
                lines.push("<span class=\"slot-sub slot-sub-line\">" + escapeHtml(line) + "</span>");
            });
            return lines.join("");
        }

        function renderMobileSlotTime(slotKey) {
            const detailLines = getSlotDetailLines(slotKey);
            if (detailLines.length === 0) {
                return "";
            }

            return "<div class=\"mobile-slot-time\">" + detailLines.map((line) => "<div>" + escapeHtml(line) + "</div>").join("") + "</div>";
        }

        function getSlotDetailLines(slotKey) {
            return extractPeriodNumbers(slotKey).map((periodNumber) => {
                const timetable = timetableMap.get(String(periodNumber));
                if (!timetable) {
                    return "第" + periodNumber + "节";
                }

                const parts = ["第" + periodNumber + "节"];
                if (timetable.label) {
                    parts.push(timetable.label);
                }
                if (timetable.start && timetable.end) {
                    parts.push(formatClock(timetable.start) + " - " + formatClock(timetable.end));
                }
                return parts.join(" ");
            });
        }

        function extractPeriodNumbers(slotKey) {
            const matches = String(slotKey).match(/\d+/g) || [];
            const numbers = matches.map((value) => Number(value)).filter((value) => Number.isFinite(value));
            if (numbers.length === 0) {
                return [];
            }

            if (numbers.length === 1) {
                return [numbers[0]];
            }

            const start = numbers[0];
            const end = numbers[numbers.length - 1];
            if (end < start) {
                return [start];
            }

            const periods = [];
            for (let index = start; index <= end; index += 1) {
                periods.push(index);
            }
            return periods;
        }

        function formatClock(value) {
            return String(value || "").slice(0, 5);
        }

        function extractSlotOrder(value) {
            const match = String(value).match(/(\d+)/);
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        function uniqueValues(values) {
            return Array.from(new Set(values.filter(Boolean)));
        }

        async function loadTodayPreset() {
            const today = new Date();
            const todayString = [
                today.getFullYear(),
                String(today.getMonth() + 1).padStart(2, "0"),
                String(today.getDate()).padStart(2, "0")
            ].join("-");

            for (const config of presetConfigs) {
                try {
                    const response = await fetch(config.file, { cache: "no-store" });
                    if (!response.ok) {
                        continue;
                    }

                    const data = await response.json();
                    const includesToday = Array.isArray(data.rqazcList)
                        && data.rqazcList.some((day) => day.rq === todayString);
                    if (includesToday) {
                        setActivePreset(config.file);
                        renderSchedule(data, config.file);
                        setStatus("已根据今天日期加载 " + config.file + "。", false);
                        return;
                    }
                } catch (error) {
                    continue;
                }
            }

            if (presetConfigs.length > 0) {
                loadPreset(presetConfigs[0].file);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function initialize() {
            await loadTimetable();
            await loadTodayPreset();
        }

        initialize();
    </script>
</body>
</html>
